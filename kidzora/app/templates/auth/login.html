{% extends "base.html" %}

{% block title %}Login - KidZora{% endblock %}

{% block seo_meta %}
<meta name="robots" content="noindex, nofollow">
<meta property="og:site_name" content="KidZora">
<link rel="canonical" href="{{ request.base_url }}">
{% endblock %}

{% block content %}
<div class="kidzora-login-container">
    <div class="kidzora-login-wrapper">
        <!-- Logo and Branding -->
        <div class="kidzora-login-header">
            <div class="kidzora-logo-box">
                <img src="{{ url_for('static', filename='images/kz_icon.png') }}" alt="KidZora" class="kidzora-logo-icon">
            </div>
            <h1 class="kidzora-brand-title">KidZora</h1>
            <p class="kidzora-brand-subtitle">Login to your account</p>
        </div>

        <!-- Login Form -->
        <form method="POST" id="loginForm" class="kidzora-login-form">
            <!-- Email Input -->
            <div class="kidzora-form-group">
                <div class="kidzora-input-wrapper">
                    <span class="kidzora-input-icon">
                        <i class="fas fa-envelope"></i>
                    </span>
                    <input 
                        type="email" 
                        class="kidzora-input-field" 
                        id="email" 
                        name="email"
                        placeholder="Email Address"
                        data-validate='{"type":"email","required":true}' 
                        required 
                        autocomplete="email">
                </div>
            </div>

            <!-- Password Input -->
            <div class="kidzora-form-group">
                <div class="kidzora-input-wrapper">
                    <span class="kidzora-input-icon">
                        <i class="fas fa-lock"></i>
                    </span>
                    <input 
                        type="password" 
                        class="kidzora-input-field" 
                        id="password" 
                        name="password"
                        placeholder="Password"
                        data-validate='{"required":true,"minLength":6}' 
                        required 
                        autocomplete="current-password">
                    <button 
                        type="button" 
                        class="kidzora-password-toggle" 
                        id="passwordToggle"
                        aria-label="Toggle password visibility">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
            </div>

            <!-- Forgot Password Link -->
            <div class="kidzora-forgot-password">
                <a href="{{ url_for('auth.forgot_password') }}">
                    <i class="fas fa-lock me-1"></i>Forgot Password?
                </a>
            </div>

            <!-- Login Button -->
            <button type="submit" class="kidzora-login-button">
                Login
            </button>
        </form>

        <!-- Sign Up Link -->
        <div class="kidzora-signup-section">
            <p>Don't have an account? <a href="{{ url_for('auth.register') }}">Sign Up</a></p>
        </div>
    </div>
</div>

<style>
    /* ── KidZora Login Page Styles ── */
    body.login-page {
        margin: 0;
        padding: 0;
        background: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 25%, #f8a5c4 50%, #95e1d3 100%);
        min-height: 100vh;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    }

    .kidzora-login-container {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 20px;
        background: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 25%, #f8a5c4 50%, #95e1d3 100%);
    }

    .kidzora-login-wrapper {
        background: white;
        border-radius: 20px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
        padding: 60px 50px;
        width: 100%;
        max-width: 420px;
        animation: slideInUp 0.5s ease-out;
    }

    @keyframes slideInUp {
        from {
            opacity: 0;
            transform: translateY(30px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    /* ── Logo and Header ── */
    .kidzora-login-header {
        text-align: center;
        margin-bottom: 40px;
    }

    .kidzora-logo-box {
        width: 80px;
        height: 80px;
        margin: 0 auto 20px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        border-radius: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 10px 25px rgba(102, 126, 234, 0.3);
    }

    .kidzora-logo-icon {
        width: 50px;
        height: 50px;
        object-fit: contain;
        display: block;
    }

    .kidzora-brand-title {
        font-size: 32px;
        font-weight: 700;
        color: #1a202c;
        margin: 0 0 8px;
        letter-spacing: -0.5px;
    }

    .kidzora-brand-subtitle {
        font-size: 14px;
        color: #718096;
        margin: 0;
        font-weight: 400;
    }

    /* ── Form Styling ── */
    .kidzora-login-form {
        margin-bottom: 24px;
    }

    .kidzora-form-group {
        margin-bottom: 20px;
    }

    .kidzora-input-wrapper {
        position: relative;
        display: flex;
        align-items: center;
    }

    .kidzora-input-icon {
        position: absolute;
        left: 16px;
        color: #cbd5e0;
        font-size: 16px;
        pointer-events: none;
        transition: color 0.3s ease;
    }

    .kidzora-input-field {
        width: 100%;
        padding: 14px 45px 14px 45px;
        border: 2px solid #e2e8f0;
        border-radius: 10px;
        font-size: 15px;
        font-family: inherit;
        transition: all 0.3s ease;
        background: #f7fafc;
    }

    .kidzora-input-field:focus {
        outline: none;
        border-color: #667eea;
        background: white;
        box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    .kidzora-input-field::placeholder {
        color: #a0aec0;
    }

    .kidzora-input-wrapper:has(.kidzora-input-field:focus) .kidzora-input-icon {
        color: #667eea;
    }

    /* ── Password Toggle Button ── */
    .kidzora-password-toggle {
        position: absolute;
        right: 14px;
        z-index: 3;
        width: 32px;
        height: 32px;
        background: none;
        border: none;
        color: #cbd5e0;
        cursor: pointer;
        font-size: 16px;
        padding: 4px;
        transition: color 0.3s ease;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .kidzora-password-toggle:hover {
        color: #a0aec0;
    }

    .kidzora-password-toggle:focus {
        outline: none;
        color: #667eea;
    }

    /* ── Forgot Password Link ── */
    .kidzora-forgot-password {
        text-align: right;
        margin-bottom: 24px;
    }

    .kidzora-forgot-password a {
        font-size: 13px;
        color: #667eea;
        text-decoration: none;
        font-weight: 500;
        transition: color 0.3s ease;
    }

    .kidzora-forgot-password a:hover {
        color: #764ba2;
        text-decoration: underline;
    }

    /* ── Login Button ── */
    .kidzora-login-button {
        width: 100%;
        padding: 14px 24px;
        border: none;
        border-radius: 10px;
        font-size: 16px;
        font-weight: 600;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
    }

    .kidzora-login-button:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
    }

    .kidzora-login-button:active {
        transform: translateY(0);
    }

    .kidzora-login-button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
    }

    /* ── Sign Up Section ── */
    .kidzora-signup-section {
        text-align: center;
        padding-top: 24px;
        border-top: 1px solid #e2e8f0;
    }

    .kidzora-signup-section p {
        margin: 0;
        font-size: 14px;
        color: #4a5568;
    }

    .kidzora-signup-section a {
        color: #667eea;
        text-decoration: none;
        font-weight: 600;
        transition: color 0.3s ease;
    }

    .kidzora-signup-section a:hover {
        color: #764ba2;
        text-decoration: underline;
    }

    /* ── Responsive Design ── */
    @media (max-width: 480px) {
        .kidzora-login-wrapper {
            padding: 40px 24px;
            max-width: 100%;
        }

        .kidzora-brand-title {
            font-size: 28px;
        }

        .kidzora-logo-box {
            width: 70px;
            height: 70px;
        }

        .kidzora-logo-icon {
            width: 45px;
            height: 45px;
        }

        .kidzora-login-button {
            padding: 12px 20px;
            font-size: 15px;
        }

        .kidzora-input-field {
            padding: 12px 40px 12px 40px;
            font-size: 14px;
        }
    }

    /* ── Override base styles for login page ── */
    .kidzora-login-container .btn,
    .kidzora-login-container .form-control,
    .kidzora-login-container .form-label {
        /* Remove base Bootstrap styles that might conflict */
    }

    /* ── Hide navbar on login page ── */
    body .navbar {
        display: none !important;
    }

    /* ── Full-height body ── */
    body, html {
        height: 100%;
        margin: 0;
        padding: 0;
    }

    body {
        background: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 25%, #f8a5c4 50%, #95e1d3 100%) !important;
    }

    /* Mobile app inspired refresh */
    body.login-page,
    body {
        color: #31405f;
        background:
            radial-gradient(circle at 11% 22%, rgba(223, 248, 235, 0.62), transparent 12rem),
            radial-gradient(circle at 90% 8%, rgba(255, 255, 255, 0.42), transparent 10rem),
            radial-gradient(circle at 78% 78%, rgba(255, 221, 235, 0.62), transparent 13rem),
            linear-gradient(135deg, #e9ddff 4%, #d9f0ff 38%, #ffddeb 70%, #dff8eb 100%) !important;
    }

    .kidzora-login-container {
        position: relative;
        overflow: hidden;
        background:
            radial-gradient(circle at 11% 22%, rgba(223, 248, 235, 0.62), transparent 12rem),
            radial-gradient(circle at 90% 8%, rgba(255, 255, 255, 0.42), transparent 10rem),
            radial-gradient(circle at 78% 78%, rgba(255, 221, 235, 0.62), transparent 13rem),
            linear-gradient(135deg, #e9ddff 4%, #d9f0ff 38%, #ffddeb 70%, #dff8eb 100%);
    }

    .kidzora-login-container::before,
    .kidzora-login-container::after {
        content: "";
        position: absolute;
        pointer-events: none;
        background: rgba(255, 255, 255, 0.24);
    }

    .kidzora-login-container::before {
        width: 18rem;
        height: 13rem;
        left: -5rem;
        top: 2rem;
        border-radius: 48% 52% 45% 55%;
    }

    .kidzora-login-container::after {
        width: 120%;
        height: 9rem;
        left: -10%;
        bottom: -3.5rem;
        border-radius: 50% 50% 0 0;
    }

    .kidzora-login-wrapper {
        position: relative;
        z-index: 1;
        max-width: 430px;
        padding: 0;
        background: transparent;
        box-shadow: none;
        animation: slideInUp 0.75s ease-out;
    }

    .kidzora-login-header {
        margin-bottom: 28px;
    }

    .kidzora-login-form {
        padding: 22px 20px;
        margin-bottom: 0;
        border: 1.2px solid rgba(255, 255, 255, 0.82);
        border-radius: 28px;
        background: rgba(255, 255, 255, 0.66);
        box-shadow: 0 18px 30px rgba(126, 138, 184, 0.16);
        backdrop-filter: blur(18px);
    }

    .kidzora-logo-box {
        width: 88px;
        height: 88px;
        padding: 10px;
        background: rgba(255, 255, 255, 0.7);
        border-radius: 24px;
        box-shadow: 0 12px 24px rgba(143, 155, 255, 0.16);
    }

    .kidzora-logo-icon {
        width: 66px;
        height: 66px;
        border-radius: 18px;
    }

    .kidzora-brand-title {
        color: #31405f;
        font-size: 34px;
        font-weight: 800;
        letter-spacing: 0;
    }

    .kidzora-brand-subtitle,
    .kidzora-signup-section p {
        color: #77839d;
        font-weight: 600;
    }

    .kidzora-input-field {
        min-height: 56px;
        padding: 15px 48px;
        border: 1px solid rgba(255, 255, 255, 0.9);
        border-radius: 18px;
        color: #31405f;
        font-size: 15px;
        font-weight: 600;
        background: rgba(255, 255, 255, 0.76);
    }

    .kidzora-input-field:focus {
        border-color: rgba(115, 215, 208, 0.95);
        box-shadow: 0 0 0 4px rgba(115, 215, 208, 0.14);
    }

    .kidzora-input-field::placeholder {
        color: #adb6c8;
        font-weight: 500;
    }

    .kidzora-input-icon {
        color: #8f9bff;
    }

    .kidzora-input-wrapper:has(.kidzora-input-field:focus) .kidzora-input-icon,
    .kidzora-password-toggle:focus {
        color: #73d7d0;
    }

    .kidzora-forgot-password a,
    .kidzora-signup-section a {
        color: #8f9bff;
        font-weight: 800;
    }

    .kidzora-login-button {
        min-height: 56px;
        border-radius: 18px;
        font-weight: 800;
        background: linear-gradient(90deg, #8f9bff, #ff8ea8, #73d7d0);
        box-shadow: 0 10px 18px rgba(143, 155, 255, 0.28);
    }

    .kidzora-login-button:hover {
        box-shadow: 0 14px 24px rgba(143, 155, 255, 0.32);
    }

    .kidzora-signup-section {
        border-top: 0;
        padding-top: 24px;
    }

    @media (max-width: 480px) {
        .kidzora-login-form {
            padding: 20px 18px;
        }

        .kidzora-login-wrapper {
            padding: 0;
        }
    }
</style>
{% endblock %}

{% block extra_js %}
<script>
(function() {
  'use strict';
  
  // Password visibility toggle
  function initPasswordToggle() {
    const passwordInput = document.getElementById('password');
    const passwordToggle = document.getElementById('passwordToggle');
    
    if (!passwordToggle || !passwordInput) return;
    if (passwordToggle.dataset.kzToggleReady === 'true') return;
    passwordToggle.dataset.kzToggleReady = 'true';
    
    passwordToggle.addEventListener('click', function(e) {
      e.preventDefault();
      e.stopPropagation();
      const isPassword = passwordInput.type === 'password';
      passwordInput.type = isPassword ? 'text' : 'password';
      
      // Update icon
      const icon = this.querySelector('i');
      if (icon) {
        icon.classList.remove(isPassword ? 'fa-eye' : 'fa-eye-slash');
        icon.classList.add(isPassword ? 'fa-eye-slash' : 'fa-eye');
      }
      this.setAttribute('aria-label', isPassword ? 'Hide password' : 'Show password');
    });
  }
  
  // Wait for setupValidation to be available (in case it loads asynchronously)
  function initValidation() {
    var form = document.getElementById('loginForm');
    if (!form) return;
    
    // Check if setupValidation is available
    if (typeof window.setupValidation !== 'function') {
      console.warn('setupValidation not available yet, retrying in 100ms');
      setTimeout(initValidation, 100);
      return;
    }
    
    console.log('[OK] setupValidation available, initializing form validation');
    
    // Setup real-time validation on email
    window.setupValidation('#email', { type: 'email', required: true });
    
    // Setup form submit validation - form will submit if valid
    window.setupFormSubmit(form, function(e) {
      form.submit();
    });
  }
  
  // Initialize when DOM is ready
  function initLoginPage() {
    initPasswordToggle();
    initValidation();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initLoginPage);
  } else {
    initLoginPage();
  }
})();
</script>
{% endblock %}
