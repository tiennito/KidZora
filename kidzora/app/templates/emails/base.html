<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f9; padding: 30px; margin: 0; }
        .container { max-width: 520px; margin: auto; background: #fff; border-radius: 12px; padding: 40px; box-shadow: 0 2px 12px rgba(0,0,0,.08); }
        .header { text-align: center; margin-bottom: 24px; }
        .logo { color: #4f46e5; margin: 0; font-size: 1.8rem; letter-spacing: -0.5px; }
        .tagline { color: #6b7280; font-size: 0.8rem; margin: 4px 0 0; }
        .footer { margin-top: 28px; padding-top: 28px; border-top: 1px solid #e5e7eb; }
        .footer-text { color: #9ca3af; font-size: 0.75rem; text-align: center; margin: 0; }
        .footer-text a { color: #4f46e5; text-decoration: none; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 class="logo">KidZora</h1>
            <p class="tagline">kids marketplace you can trust</p>
        </div>

        {% block content %}{% endblock %}

        <div class="footer">
            <p class="footer-text">
                Questions? Contact us at <a href="mailto:support@kidzora.com">support@kidzora.com</a>
            </p>
        </div>
    </div>
</body>
</html>
