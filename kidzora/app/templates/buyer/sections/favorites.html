<!-- My Favorites Tab -->
<div class="card-body p-4">
  <h5 class="fw-bold mb-4"><i class="fas fa-heart me-2 text-danger"></i>My Favorites</h5>
  
  <div class="row g-3">
    {% if wishlisted_ids %}
      <!-- Will be populated with favorited products -->
      <div class="col-12">
        <div class="text-center py-5 text-muted">
          <i class="fas fa-heart text-danger" style="font-size: 3rem;"></i>
          <p class="mt-3">You have {{ wishlisted_ids|length }} favorited item(s)</p>
          <p class="small">Implement product grid here to display wishlist items</p>
        </div>
      </div>
    {% else %}
      <div class="col-12">
        <div class="text-center py-5">
          <i class="fas fa-heart text-muted" style="font-size: 3rem;"></i>
          <p class="text-muted mt-3 mb-3">You don't have any favorited items yet.</p>
          <a href="{{ url_for('buyer.browse_products') }}" class="btn btn-danger btn-sm">
            <i class="fas fa-shopping-bag me-1"></i>Browse Products
          </a>
        </div>
      </div>
    {% endif %}
  </div>
</div>
